version: 2.1

orbs:
  flutter: circleci/flutter@2.0.0

jobs:
  build_and_test:
    executor:
      name: flutter/default
    steps:
      - checkout
      - run:
          name: Install Flutter
          command: flutter/bin/flutter precache
      - run:
          name: Install dependencies
          command: flutter pub get
      - run:
          name: Analyze code
          command: flutter analyze
      - run:
          name: Run tests
          command: flutter test --coverage
      - run:
          name: Validate coverage file
          command: |
            if [ ! -f coverage/lcov.info ]; then
              echo "Coverage file not found!"
              exit 1
            fi
            echo "Coverage OK."
      - run:
          name: Build debug APK
          command: flutter build apk --debug
      - run:
          name: List APK
          command: ls -lh build/app/outputs/flutter-apk/

workflows:
  version: 2
  build_test:
    jobs:
      - build_and_test